name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: CI only checks code, it never writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      # Pinned to a full commit SHA so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # With no arguments, installs the toolchain and components from rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # Checks every committed vector file against its pinned checksum before tests load it,
      # so an edited or truncated file fails here instead of as a confusing test failure.
      - run: uv run vectors/fetch_vectors.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Browser demos also build for Wasm, where the code compiled differs (wasm-bindgen glue).
      - run: cargo clippy -p hello-wasm --target wasm32-unknown-unknown --locked -- -D warnings
      - run: cargo test --workspace --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Checks RustSec advisories, licenses and duplicate crates against deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features --locked
