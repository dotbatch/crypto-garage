# Weekly update PRs for pinned GitHub Actions and Cargo dependencies.
# Dependabot keeps action SHAs pinned and updates the version comment beside them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # The Cargo workspace root; covers every crate in apps/ and learn/.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
