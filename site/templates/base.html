<!DOCTYPE html>
<html lang="{{ config.default_language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  <meta name="description" content="{{ config.description }}">
  {# Only same-origin assets: no external scripts, fonts or stylesheets. #}
  <link rel="stylesheet" href="{{ get_url(path='style.css', cachebust=true) }}">
  <link rel="icon" href="{{ get_url(path='favicon.svg') }}" type="image/svg+xml">
</head>
<body>
  {# First in tab order, so keyboard users can jump past the header. #}
  <a class="skip-link" href="#main">Skip to content</a>
  <header>
    <a class="site-name" href="{{ config.base_url }}/">{{ config.title }}</a>
    <nav><a href="{{ get_url(path='@/about.md') }}">About</a></nav>
  </header>
  <main id="main">
    {% block content %}{% endblock %}
  </main>
  <footer>
    <a href="{{ config.extra.repo_url }}">Source on GitHub</a>
  </footer>
</body>
</html>
